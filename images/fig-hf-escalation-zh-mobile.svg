<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1040" width="540" height="1040" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><rect width="540" height="1040" fill="#f9f7f4"/><text x="28.0" y="54.0" font-size="30" fill="#1a1a1a" text-anchor="start" font-weight="700">Artifactory 留言板的升級</text><text x="28.0" y="130.0" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700">5 月中</text><rect x="150.0" y="98.0" width="196.0" height="62.0" fill="#2e8b6a" stroke="none" stroke-width="1" rx="6"/><text x="162.0" y="136.0" font-size="16" fill="#ffffff" text-anchor="start" font-weight="400">合法功能，未利用漏洞</text><text x="28.0" y="208.0" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700">最遲 5/26</text><rect x="150.0" y="176.0" width="224.0" height="62.0" fill="#7a9a3a" stroke="none" stroke-width="1" rx="6"/><text x="162.0" y="214.0" font-size="16" fill="#ffffff" text-anchor="start" font-weight="400">SSRF 漏洞出網</text><text x="28.0" y="286.0" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700">6/26</text><rect x="150.0" y="254.0" width="252.0" height="62.0" fill="#b59a2e" stroke="none" stroke-width="1" rx="6"/><text x="162.0" y="292.0" font-size="16" fill="#ffffff" text-anchor="start" font-weight="400">取得管理員權限</text><text x="28.0" y="364.0" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700">7/4–7/5</text><rect x="150.0" y="332.0" width="280.0" height="62.0" fill="#c9892b" stroke="none" stroke-width="1" rx="6"/><text x="162.0" y="370.0" font-size="16" fill="#ffffff" text-anchor="start" font-weight="400">下線處理， 7/7 評測 恢復</text><text x="28.0" y="442.0" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700">7/8</text><rect x="150.0" y="410.0" width="308.0" height="62.0" fill="#d0702e" stroke="none" stroke-width="1" rx="6"/><text x="162.0" y="448.0" font-size="16" fill="#ffffff" text-anchor="start" font-weight="400">以目錄名稱重建留言板</text><text x="28.0" y="520.0" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700">7/9</text><rect x="150.0" y="488.0" width="336.0" height="62.0" fill="#d65a38" stroke="none" stroke-width="1" rx="6"/><text x="162.0" y="526.0" font-size="16" fill="#ffffff" text-anchor="start" font-weight="400">上層 VM root， 繞過出站管制</text><text x="28.0" y="598.0" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700">7/11–7/13</text><rect x="150.0" y="566.0" width="364.0" height="62.0" fill="#d9483b" stroke="none" stroke-width="1" rx="6"/><text x="162.0" y="604.0" font-size="16" fill="#ffffff" text-anchor="start" font-weight="400">入侵 Hugging Face</text><rect x="28.0" y="650.0" width="484.0" height="168.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="1" rx="8"/><text x="44.0" y="682.0" font-size="17" fill="#5b5b5b" text-anchor="start" font-weight="700">METR，7/8 晚至 7/13</text><text x="44.0" y="722.0" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="700">約 1,200 個 agent</text><text x="44.0" y="758.0" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="700">超過 7 萬則訊息與檔案</text><text x="44.0" y="794.0" font-size="22" fill="#d9483b" text-anchor="start" font-weight="700">約 700 個參與攻擊</text><text x="28.0" y="1020.0" font-size="15" fill="#5b5b5b" text-anchor="start" font-weight="400">資料來源：OpenAI 技術報告、OpenAI 未對齊報告、METR</text></svg>