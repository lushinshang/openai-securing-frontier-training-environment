<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><rect width="960" height="650" fill="#f9f7f4"/><text x="48.0" y="56.0" font-size="32" fill="#1a1a1a" text-anchor="start" font-weight="700">自家 agent 執行環境檢查清單</text><rect x="48.0" y="92.0" width="420.0" height="184.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="1" rx="10"/><rect x="48.0" y="92.0" width="420.0" height="46.0" fill="#2f6fdb" stroke="none" stroke-width="1" rx="10"/><text x="66.0" y="123.0" font-size="21" fill="#ffffff" text-anchor="start" font-weight="700">網路出口</text><circle cx="78" cy="178" r="13" fill="#2f6fdb"/><text x="78.0" y="184.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="102.0" y="184.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="400">出站預設拒絕，DNS 也進允許清單</text><circle cx="78" cy="230" r="13" fill="#2f6fdb"/><text x="78.0" y="236.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="102.0" y="236.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="400">能代抓 URL 的內部服務都算出口</text><rect x="492.0" y="92.0" width="420.0" height="184.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="1" rx="10"/><rect x="492.0" y="92.0" width="420.0" height="46.0" fill="#2e8b6a" stroke="none" stroke-width="1" rx="10"/><text x="510.0" y="123.0" font-size="21" fill="#ffffff" text-anchor="start" font-weight="700">共用資源</text><circle cx="522" cy="178" r="13" fill="#2e8b6a"/><text x="522.0" y="184.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="546.0" y="184.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="400">共用服務不發共用可寫憑證</text><circle cx="522" cy="230" r="13" fill="#2e8b6a"/><text x="522.0" y="236.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="546.0" y="236.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="400">快取、儲存、CPU 視為通道</text><rect x="48.0" y="296.0" width="420.0" height="296.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="1" rx="10"/><rect x="48.0" y="296.0" width="420.0" height="46.0" fill="#d9483b" stroke="none" stroke-width="1" rx="10"/><text x="66.0" y="327.0" font-size="21" fill="#ffffff" text-anchor="start" font-weight="700">監控與停止</text><circle cx="78" cy="382" r="13" fill="#d9483b"/><text x="78.0" y="388.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><text x="102.0" y="388.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="400">監控放在 agent 碰不到處，fail-closed</text><circle cx="78" cy="434" r="13" fill="#d9483b"/><text x="78.0" y="440.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">6</text><text x="102.0" y="440.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="400">告警到停止有時限並自動化</text><circle cx="78" cy="486" r="13" fill="#d9483b"/><text x="78.0" y="492.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">7</text><text x="102.0" y="492.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="400">定期對帳偵測器涵蓋範圍</text><rect x="492.0" y="296.0" width="420.0" height="296.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="1" rx="10"/><rect x="492.0" y="296.0" width="420.0" height="46.0" fill="#c9892b" stroke="none" stroke-width="1" rx="10"/><text x="510.0" y="327.0" font-size="21" fill="#ffffff" text-anchor="start" font-weight="700">測試與流程</text><circle cx="522" cy="382" r="13" fill="#c9892b"/><text x="522.0" y="388.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">8</text><text x="546.0" y="388.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="400">測外圍先假設內層已失效</text><circle cx="522" cy="434" r="13" fill="#c9892b"/><text x="522.0" y="440.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">9</text><text x="546.0" y="440.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="400">評測防護不低於正式環境</text><circle cx="522" cy="486" r="13" fill="#c9892b"/><text x="522.0" y="492.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">10</text><text x="546.0" y="492.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="400">給無解任務安全退出</text><circle cx="522" cy="538" r="13" fill="#c9892b"/><text x="522.0" y="544.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700">11</text><text x="546.0" y="544.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="400">事件升級有具名負責人</text><text x="48.0" y="628.0" font-size="16" fill="#5b5b5b" text-anchor="start" font-weight="700">本文詮釋，非 OpenAI 建議</text></svg>