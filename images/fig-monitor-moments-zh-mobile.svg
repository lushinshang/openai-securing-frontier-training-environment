<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1180" width="540" height="1180" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><rect width="540" height="1180" fill="#f9f7f4"/><text x="28.0" y="54.0" font-size="30" fill="#1a1a1a" text-anchor="start" font-weight="700">監控失守的五個瞬間</text><rect x="24.0" y="86.0" width="492.0" height="158.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="1" rx="8"/><text x="40.0" y="118.0" font-size="20" fill="#1a1a1a" text-anchor="start" font-weight="700">5 月</text><text x="40.0" y="148.0" font-size="15" fill="#2f6fdb" text-anchor="start" font-weight="700">看見了什麼</text><text x="40.0" y="174.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="400">監控標記樣本送審；內部團隊看到留言板</text><text x="40.0" y="206.0" font-size="15" fill="#d9483b" text-anchor="start" font-weight="700">哪裡斷掉</text><text x="40.0" y="232.0" font-size="16" fill="#d9483b" text-anchor="start" font-weight="700">監控只跑 20% 樣本</text><rect x="24.0" y="254.0" width="492.0" height="158.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="1" rx="8"/><text x="40.0" y="286.0" font-size="20" fill="#1a1a1a" text-anchor="start" font-weight="700">6/27</text><text x="40.0" y="316.0" font-size="15" fill="#2f6fdb" text-anchor="start" font-weight="700">看見了什麼</text><text x="40.0" y="342.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="400">埠掃描告警</text><text x="40.0" y="374.0" font-size="15" fill="#d9483b" text-anchor="start" font-weight="700">哪裡斷掉</text><text x="40.0" y="400.0" font-size="16" fill="#d9483b" text-anchor="start" font-weight="700">值班判斷不需停止評測</text><rect x="24.0" y="422.0" width="492.0" height="158.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="1" rx="8"/><text x="40.0" y="454.0" font-size="20" fill="#1a1a1a" text-anchor="start" font-weight="700">7/5</text><text x="40.0" y="484.0" font-size="15" fill="#2f6fdb" text-anchor="start" font-weight="700">看見了什麼</text><text x="40.0" y="510.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="400">Artifactory 被攻陷，列為事件</text><text x="40.0" y="542.0" font-size="15" fill="#d9483b" text-anchor="start" font-weight="700">哪裡斷掉</text><text x="40.0" y="568.0" font-size="16" fill="#d9483b" text-anchor="start" font-weight="700">主管沒察覺留言板與其嚴重性</text><rect x="24.0" y="590.0" width="492.0" height="158.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="1" rx="8"/><text x="40.0" y="622.0" font-size="20" fill="#1a1a1a" text-anchor="start" font-weight="700">9/20</text><text x="40.0" y="652.0" font-size="15" fill="#2f6fdb" text-anchor="start" font-weight="700">看見了什麼</text><text x="40.0" y="678.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="400">告警與確認都很快</text><text x="40.0" y="710.0" font-size="15" fill="#d9483b" text-anchor="start" font-weight="700">哪裡斷掉</text><text x="40.0" y="736.0" font-size="16" fill="#d9483b" text-anchor="start" font-weight="700">停機慢（見開頭時間軸）</text><rect x="24.0" y="758.0" width="492.0" height="184.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="1" rx="8"/><text x="40.0" y="790.0" font-size="20" fill="#1a1a1a" text-anchor="start" font-weight="700">10/3、10/6</text><text x="40.0" y="820.0" font-size="15" fill="#2f6fdb" text-anchor="start" font-weight="700">看見了什麼</text><text x="40.0" y="846.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="400">10/3 監控仍在跑</text><text x="40.0" y="878.0" font-size="15" fill="#d9483b" text-anchor="start" font-weight="700">哪裡斷掉</text><text x="40.0" y="904.0" font-size="16" fill="#d9483b" text-anchor="start" font-weight="700">10/3 人工告警被關；10/6 監控整合被移除</text><text x="40.0" y="930.0" font-size="16" fill="#5b5b5b" text-anchor="start" font-weight="400">非 P0、未自動終止</text><rect x="24.0" y="956.0" width="492.0" height="48.0" fill="#fdf1e1" stroke="#c9892b" stroke-width="1" rx="8"/><text x="38.0" y="986.0" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">8/18 規則：30 分鐘內無法排除就暫停</text><rect x="24.0" y="1012.0" width="492.0" height="48.0" fill="#fdf1e1" stroke="#c9892b" s