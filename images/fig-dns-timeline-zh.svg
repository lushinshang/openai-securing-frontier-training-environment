<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><rect width="960" height="540" fill="#f9f7f4"/><text x="48.0" y="56.0" font-size="32" fill="#1a1a1a" text-anchor="start" font-weight="700">9/20 DNS 事件：告警很快，停機很慢</text><text x="48.0" y="90.0" font-size="18" fill="#5b5b5b" text-anchor="start" font-weight="400">依實際時間比例繪製（報告時間，未註明時區）</text><rect x="70.0" y="236" width="59.0" height="28" fill="#2f6fdb" rx="3"/><rect x="129.0" y="236" width="14.6" height="28" fill="#2e8b6a" rx="3"/><rect x="143.5" y="236" width="746.5" height="28" fill="#d9483b" rx="3"/><text x="516.8" y="257.0" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="700">訓練未自動停止，持續約 2.5 小時</text><line x1="70.0" y1="236" x2="70.0" y2="138" stroke="#1a1a1a" stroke-width="1.2"/><circle cx="70.0" cy="250" r="5" fill="#1a1a1a"/><text x="76.0" y="134.0" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="700">09:50:23　外部回應</text><line x1="129.0" y1="236" x2="129.0" y2="168" stroke="#1a1a1a" stroke-width="1.2"/><circle cx="129.0" cy="250" r="5" fill="#1a1a1a"/><text x="135.0" y="164.0" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="700">10:02:11　P0 告警（約 12 分鐘）</text><line x1="143.5" y1="236" x2="143.5" y2="198" stroke="#1a1a1a" stroke-width="1.2"/><circle cx="143.5" cy="250" r="5" fill="#1a1a1a"/><text x="149.5" y="194.0" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="700">10:05:06　人員確認（約 3 分鐘）</text><line x1="890.0" y1="236" x2="890.0" y2="138" stroke="#1a1a1a" stroke-width="1.2"/><circle cx="890.0" cy="250" r="5" fill="#1a1a1a"/><text x="884.0" y="134.0" font-size="19" fill="#1a1a1a" text-anchor="end" font-weight="700">12:34:30　人工終止</text><line x1="278.9" y1="236" x2="278.9" y2="370" stroke="#c9892b" stroke-width="2" stroke-dasharray="6 5"/><text x="286.9" y="302.0" font-size="18" fill="#c9892b" text-anchor="start" font-weight="700">8/18 規則：告警後 30 分鐘內無法排除就須暫停</text><text x="286.9" y="326.0" font-size="16" fill="#5b5b5b" text-anchor="start" font-weight="400">（門檻位置為導讀依規則推算，約 10:32）</text><rect x="48" y="380" width="410" height="108" fill="#ffffff" stroke="#d9d6d0" rx="8"/><text x="64.0" y="412.0" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="700">回頭看到的盲點</text><text x="64.0" y="442.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="400">另一個 DNS 異常偵測器排除了這個環境</text><text x="64.0" y="468.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="400">「查不到有用資訊」被當成連網失敗</text><rect x="482" y="380" width="430" height="108" fill="#ffffff" stroke="#d9d6d0" rx="8"/><text x="498.0" y="412.0" font-size="19" fill="#1a1a1a" text-anchor="start" font-weight="700">事後處置</text><text x="498.0" y="442.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="400">兩個獨立層級阻擋；DNS 限縮為網域與記錄類型允許清單</text><text x="498.0" y="468.0" font-size="17" fill="#1a1a1a" text-anchor="start" font-weight="400">暫停最強模型訓練與評測 11 天（9/20 至 10/1）</text><text x="48.0" y="518.0" font-size="16" fill="#5b5b5b" text-anchor="start" font-weight="400">資料來源：OpenAI 未對齊報告〈An agent used DNS to reach an external chatbot〉</text></svg>