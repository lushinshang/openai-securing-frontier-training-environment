<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1160" width="540" height="1160" font-family='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif'><rect width="540" height="1160" fill="#f9f7f4"/><text x="28.0" y="54.0" font-size="27" fill="#1a1a1a" text-anchor="start" font-weight="700">自家 agent 執行環境檢查清單</text><rect x="24.0" y="84.0" width="492.0" height="164.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="1" rx="10"/><rect x="24.0" y="84.0" width="492.0" height="44.0" fill="#2f6fdb" stroke="none" stroke-width="1" rx="10"/><text x="42.0" y="114.0" font-size="20" fill="#ffffff" text-anchor="start" font-weight="700">網路出口</text><circle cx="46" cy="157" r="12" fill="#2f6fdb"/><text x="46.0" y="162.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">1</text><text x="68.0" y="162.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="400">出站預設拒絕，DNS 也進允許清單</text><circle cx="46" cy="207" r="12" fill="#2f6fdb"/><text x="46.0" y="212.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">2</text><text x="68.0" y="212.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="400">能代抓 URL 的內部服務都算出口</text><rect x="24.0" y="262.0" width="492.0" height="164.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="1" rx="10"/><rect x="24.0" y="262.0" width="492.0" height="44.0" fill="#2e8b6a" stroke="none" stroke-width="1" rx="10"/><text x="42.0" y="292.0" font-size="20" fill="#ffffff" text-anchor="start" font-weight="700">共用資源</text><circle cx="46" cy="335" r="12" fill="#2e8b6a"/><text x="46.0" y="340.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">3</text><text x="68.0" y="340.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="400">共用服務不發共用可寫憑證</text><circle cx="46" cy="385" r="12" fill="#2e8b6a"/><text x="46.0" y="390.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">4</text><text x="68.0" y="390.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="400">快取、儲存、CPU 視為通道</text><rect x="24.0" y="440.0" width="492.0" height="214.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="1" rx="10"/><rect x="24.0" y="440.0" width="492.0" height="44.0" fill="#d9483b" stroke="none" stroke-width="1" rx="10"/><text x="42.0" y="470.0" font-size="20" fill="#ffffff" text-anchor="start" font-weight="700">監控與停止</text><circle cx="46" cy="513" r="12" fill="#d9483b"/><text x="46.0" y="518.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">5</text><text x="68.0" y="518.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="400">監控放在 agent 碰不到處，fail-closed</text><circle cx="46" cy="563" r="12" fill="#d9483b"/><text x="46.0" y="568.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">6</text><text x="68.0" y="568.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="400">告警到停止有時限並自動化</text><circle cx="46" cy="613" r="12" fill="#d9483b"/><text x="46.0" y="618.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">7</text><text x="68.0" y="618.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="400">定期對帳偵測器涵蓋範圍</text><rect x="24.0" y="668.0" width="492.0" height="264.0" fill="#ffffff" stroke="#d9d6d0" stroke-width="1" rx="10"/><rect x="24.0" y="668.0" width="492.0" height="44.0" fill="#c9892b" stroke="none" stroke-width="1" rx="10"/><text x="42.0" y="698.0" font-size="20" fill="#ffffff" text-anchor="start" font-weight="700">測試與流程</text><circle cx="46" cy="741" r="12" fill="#c9892b"/><text x="46.0" y="746.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">8</text><text x="68.0" y="746.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="400">測外圍先假設內層已失效</text><circle cx="46" cy="791" r="12" fill="#c9892b"/><text x="46.0" y="796.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">9</text><text x="68.0" y="796.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="400">評測防護不低於正式環境</text><circle cx="46" cy="841" r="12" fill="#c9892b"/><text x="46.0" y="846.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">10</text><text x="68.0" y="846.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="400">給無解任務安全退出</text><circle cx="46" cy="891" r="12" fill="#c9892b"/><text x="46.0" y="896.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700">11</text><text x="68.0" y="896.0" font-size="16" fill="#1a1a1a" text-anchor="start" font-weight="400">事件升級有具名負責人</text><text x="28.0" y="1140.0" font-size="15" fill="#5b5b5b" text-anchor="start" font-weight="700">本文詮釋，非 OpenAI 建議</text></svg>